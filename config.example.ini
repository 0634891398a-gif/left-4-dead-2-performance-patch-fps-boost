```ini
[General]
# Path to Left 4 Dead 2 installation directory
GamePath=C:\Program Files (x86)\Steam\steamapps\common\Left 4 Dead 2

# Enable/Disable performance patch
EnablePatch=true

# Set the language for output messages
Language=en

[Hotkeys]
# Hotkey for toggling performance patch on/off
TogglePatchKey=F12

# Hotkey for FPS display toggle
ToggleFPSKey=F11

# Hotkey for opening the settings menu
SettingsMenuKey=F9

[Features]
# Enable to adjust network settings for better gameplay
OptimizeNetwork=true

# Enable frame rate cap (set to 0 to disable)
FrameRateLimit=300

# Enable/Disable automatic performance optimization on game start
AutoOptimize=true

# Enable/Disable low latency input
LowLatencyInput=true

[Display]
# Set fullscreen resolution (width x height)
Resolution=1920x1080

# Set V-Sync option (true/false)
VSync=false

# Enable/Disable Anti-Aliasing
AntiAliasing=true

# Set shadow quality (0=low, 1=medium, 2=high)
ShadowQuality=1

# Enable/Disable motion blur effect
MotionBlur=false

# Enable/Disable texture streaming for improved performance
TextureStreaming=true
```