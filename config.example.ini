```ini
[General]
# Path to Left 4 Dead 2 installation
GamePath=C:\Program Files (x86)\Steam\steamapps\common\Left 4 Dead 2

# Enable or disable the performance patch
EnablePatch=True

# Enable or disable logging for troubleshooting
EnableLogging=False

[Hotkeys]
# Hotkey to toggle the performance patch on and off
TogglePatchKey=F12

# Hotkey to increase graphics performance settings quick
IncreasePerformanceKey=F11

# Hotkey to reset to default graphics settings
ResetGraphicsKey=F10

[Features]
# Enable/disable low graphics mode for improved FPS
LowGraphicsMode=True

# Enable/disable disabling of unnecessary background processes
DisableBackgroundProcesses=True

# Enable/disable the optimization of network settings
OptimizeNetwork=True

# Show FPS overlay in-game (might affect performance slightly)
ShowFPSOverlay=False

[Display]
# Resolution settings
# Set to your desired resolution for the game
ResolutionWidth=1280
ResolutionHeight=720

# V-Sync options
VSync=False

# Texture quality settings, options are Low, Medium, High
TextureQuality=Low

# Shadow quality settings, options are Low, Medium, High
ShadowQuality=Low

# Enable or disable anti-aliasing
AntiAliasing=False

# Field of view setting (default is typically 75)
FieldOfView=90
```