```ini
[General]
; Set the game's installation path
game_path=C:\Program Files (x86)\Steam\steamapps\common\Left 4 Dead 2
; Enable performance patch
enable_patch=true

[Hotkeys]
; Configure hotkeys for easy access to performance features
toggle_patch_hotkey=F12 ; Press F12 to toggle the performance patch on/off
increase_fps_hotkey=F11 ; Press F11 to increase the FPS cap
decrease_fps_hotkey=F10 ; Press F10 to decrease the FPS cap

[Features]
; Enable or disable specific performance features
enable_fps_boost=true ; Boost the frame rate during gameplay
optimize_graphics=true ; Apply optimized graphics settings for better performance
disable_vsync=false ; Set to true to disable vertical sync for reduced input lag
remove_fog=true ; Remove fog effects for better visibility and performance
enable_lag_compensation=true ; Compensates for lag during online play

[Display]
; Configure display settings for optimal performance
resolution=1920x1080 ; Set your desired screen resolution
fullscreen=true ; Set to true for fullscreen mode, false for windowed
fps_cap=60 ; Set the maximum frames per second
field_of_view=90 ; Adjust the field of view for a wider perspective
aspect_ratio=16:9 ; Set the aspect ratio for the display
```