```ini
[General]
; This section contains basic settings for the performance patch
version=1.0
game_path=C:\Program Files (x86)\Steam\steamapps\common\Left 4 Dead 2
enabled=true
auto_launch=true
update_check=true

[Hotkeys]
; Define hotkeys for quick access to features
toggle_patch=F12        ; Press F12 to toggle the performance patch on/off
toggle_vsync=F11        ; Press F11 to toggle V-Sync
increase_fps_limit=CTRL+UP   ; Increase FPS limit by 15
decrease_fps_limit=CTRL+DOWN ; Decrease FPS limit by 15

[Features]
; Enable or disable various features of the performance patch
optimize_graphics=true        ; Enable graphics optimization for better performance
disable_high_fidelity_sound=true ; Disable high-fidelity sound for improved FPS
force_max_fps=true            ; Limit FPS to a specific value
max_fps=60                    ; Set maximum FPS to 60 (adjustable)

[Display]
; Display settings related to the game rendering
resolution=1920x1080        ; Set the game resolution (change as needed)
fullscreen=true             ; Toggle fullscreen mode (true/false)
anti_aliasing=off           ; Disable anti-aliasing for better performance
texture_quality=medium      ; Set texture quality (low/medium/high)
shadow_quality=low          ; Set shadow quality (low/medium/high)
```