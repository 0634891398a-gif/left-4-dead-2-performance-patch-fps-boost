```ini
[General]
; Set the path to your Left 4 Dead 2 installation
GamePath=C:\Program Files (x86)\Steam\steamapps\common\Left 4 Dead 2

; Enable or disable the performance patch
EnablePatch=true

; Set the update interval for performance monitoring (in ms)
UpdateInterval=1000

[Hotkeys]
; Set hotkeys for in-game features
; Key mappings should be set to avoid conflict with in-game controls
TogglePatch=F11
ShowFPS=F12
OpenSettings=F9

[Features]
; Enable or disable specific performance features
; Adjust the values as needed for your system's capabilities

; Optimize particle effects
OptimizeParticles=true

; Disable shadows for better frame rates
DisableShadows=true

; Enable texture streaming to reduce memory usage
EnableTextureStreaming=true

; Unlock frame rate beyond the default limits
UnlockFrameRate=true

; Enable automatic optimization for low-end systems
AutoOptimize=true

[Display]
; Configure display settings for performance enhancements

; Set resolution (width and height)
ResolutionWidth=1920
ResolutionHeight=1080

; Set fullscreen mode (true or false)
FullScreenMode=true

; Enable or disable VSync
VSync=false

; Adjust field of view (default is usually 75, can be increased for better visibility)
FieldOfView=90
```