```ini
[General]
# Set the path to your Left 4 Dead 2 installation directory
GameDirectory=C:\Program Files (x86)\Steam\steamapps\common\Left 4 Dead 2
# Enable or disable logging for debugging purposes
EnableLogging=True

[Hotkeys]
# Configure hotkeys for performance improvements
# Default hotkey to toggle FPS display
ToggleFPS=F12
# Hotkey to clean up temporary files
CleanTempFiles=F11
# Hotkey to enable/disable performance mode
TogglePerformanceMode=F10

[Features]
# Enable or disable specific performance features
EnableFPSCounter=True  # Show FPS counter in-game
EnableTextureOptimization=True  # Optimize textures for better performance
EnableSoundQualityReduction=True  # Reduce sound quality for smoother gameplay
DisableUnusedModels=True  # Disable non-essential models to improve performance
EnableAutoBenchmark=True  # Automatically benchmark performance on launch

[Display]
# Settings for in-game display adjustments
Resolution=1920x1080  # Change to your preferred resolution
VSync=False  # Disable VSync for higher frame rates
AntiAliasing=2x  # Set anti-aliasing level (optional: 0x, 2x, 4x)
FieldOfView=90  # Adjust the field of view to your preference
Brightness=1.0  # Set brightness level (range 0.0 to 2.0)
```