```ini
[General]
; Path to Left 4 Dead 2 installation folder
GamePath=C:\Program Files (x86)\Steam\steamapps\common\Left 4 Dead 2
; Automatically apply performance patch on startup
AutoApply=true
; Log level for debugging (0=off, 1=error, 2=warning, 3=info, 4=debug)
LogLevel=3

[Hotkeys]
; Hotkey to toggle FPS display
ToggleFPSKey=F11
; Hotkey to enable/disable the performance patch
TogglePatchKey=F12

[Features]
; Enable/disable performance optimizations
EnablePerformancePatch=true
; Enable custom resolution settings
CustomResolution=true
; Set resolution (Width x Height)
Resolution=1920x1080
; Set maximum frame rate (in FPS)
MaxFPS=144
; Enable/disable advanced shader options
AdvancedShaders=false
; Use low-model settings for increased performance
LowModelSettings=true

[Display]
; Enable full-screen mode
FullScreen=true
; Adjust field of view (FOV) for better visibility
FieldOfView=90
; Disable V-Sync for reduced input lag
VSync=false
; Set texture quality (options: low, medium, high)
TextureQuality=medium
; Adjust shadow quality (options: low, medium, high)
ShadowQuality=low
```