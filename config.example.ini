```ini
[General]
; General settings for the Left 4 Dead 2 Performance Patch
GamePath=C:\Program Files (x86)\Steam\steamapps\common\Left 4 Dead 2
AutoOptimize=True ; Enable automatic optimization on startup
BackupOriginalSettings=True ; Create a backup of original settings before applying changes

[Hotkeys]
; Hotkey settings for quick access to features
TogglePerformancePatch=F1 ; Press F1 to toggle the performance patch on/off
IncreaseRenderQuality=F2 ; Press F2 to increase rendering quality temporarily
DecreaseRenderQuality=F3 ; Press F3 to decrease rendering quality temporarily

[Features]
; Features for improving game performance
EnableTextureQualityReduction=True ; Reduce texture quality for better FPS
DisablePostProcessing=True ; Disable post-processing effects to enhance performance
EnableFPSCap=True ; Cap FPS at 60 for stable performance
DisableVSync=False ; Set to True to enable VSync (may affect FPS)
EnableSoundOptimization=True ; Optimize sound settings for improved performance

[Display]
; Display settings tailored for Left 4 Dead 2
Resolution=1920x1080 ; Set your desired screen resolution
WindowedMode=False ; Set to True for windowed mode, False for fullscreen
RefreshRate=60 ; Set the refresh rate of your monitor
FieldOfView=90 ; Adjust the field of view to enhance gameplay experience
```