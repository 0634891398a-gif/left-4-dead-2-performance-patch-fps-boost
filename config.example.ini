```ini
[General]
# The path to your Left 4 Dead 2 installation directory
GamePath=C:\Program Files (x86)\Steam\steamapps\common\Left 4 Dead 2

# Set this to true if you want to enable the performance patch
EnablePerformancePatch=true

# Specify the logging level (0 = none, 1 = errors, 2 = warnings, 3 = info)
LogLevel=2

[Hotkeys]
# Hotkey to toggle the performance patch on/off
TogglePatchKey=F12

# Hotkey to refresh settings without restarting the game
RefreshSettingsKey=F10

# Hotkey to enable/disable frame rate display
ToggleFPSDisplayKey=F11

[Features]
# Enable texture optimization to reduce memory usage
OptimizeTextures=true

# Enable model LOD (Level of Detail) adjustments to improve performance
EnableModelLOD=true

# Enable the removal of unnecessary visual effects
DisableVisualEffects=true

# Automatically adjust field of view (FOV) for better performance
AutoFOVAdjustment=true

[Display]
# Set the graphical quality (Low, Medium, High)
GraphicsQuality=Medium

# Enable or disable V-Sync
VSync=false

# Set desired resolution (e.g., 1920x1080)
Resolution=1920x1080

# Enable full-screen mode (true/false)
FullScreen=true

# Adjust the brightness level (0.0 to 1.0)
Brightness=0.8
```