```ini
[General]
; General settings for the Left 4 Dead 2 performance patch application
app_name = Left 4 Dead 2 Performance Patch
version = 1.0
update_check = true  ; Check for updates on startup

[Hotkeys]
; Hotkeys for quickly accessing features in-game
toggle_patch = F12       ; Press F12 to toggle the performance patch on or off
show_fps = F11           ; Press F11 to display the current FPS
toggle_vsync = F10       ; Press F10 to toggle V-Sync on or off

[Features]
; Enable or disable specific performance enhancements
enable_cvar_modifications = true  ; Enable custom console variable changes for improved performance
disable_anti_aliasing = false      ; Set to true to disable anti-aliasing for better FPS
lower_texture_quality = false      ; Set to true to lower texture quality
enable_fps_boost = true            ; Enable FPS boost feature
disable_unnecessary_particles = true; Disables unnecessary particle effects for better performance

[Display]
; Display settings to optimize visual performance
resolution = 1920x1080           ; Set the resolution for gameplay
fullscreen = true                 ; Set to true for fullscreen mode
vsync_enabled = false             ; Set to true to enable V-Sync
aspect_ratio = 16:9               ; Aspect ratio for correct scaling
field_of_view = 90                ; Set FOV to 90 for a wider view
max_fps = 144                     ; Set maximum FPS cap
```