```ini
[General]
; General settings for the Left 4 Dead 2 performance patch application
GamePath = C:\Program Files (x86)\Steam\steamapps\common\Left 4 Dead 2
; Path to the Left 4 Dead 2 installation directory
BackupConfig = true
; Enable backup of original configuration files before applying changes

[Hotkeys]
; Key bindings for performing various patch actions
TogglePatch = F12
; Hotkey to enable or disable the performance patch
ShowFPS = F11
; Hotkey to toggle the FPS counter display
AdjustGraphics = F9
; Hotkey to cycle through graphic presets

[Features]
; Features available in the performance patch
EnableFPSBoost = true
; Enable FPS boost improvements
OptimizeTextures = true
; Optimize textures for better performance
DisableVSync = false
; Set to true to disable V-Sync (may cause screen tearing)
AutoAdjustSettings = true
; Automatically adjust graphics settings based on performance

[Display]
; Display settings for the game
Resolution = 1920x1080
; Desired screen resolution
Fullscreen = true
; Run the game in fullscreen mode
MaxFPS = 60
; Set the maximum frames per second
TextureQuality = Low
; Set texture quality to low for better performance
ShadowQuality = Off
; Disable shadows to improve performance
```