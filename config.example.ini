```ini
[General]
; General settings for the Left 4 Dead 2 performance patch
GamePath=C:\Program Files (x86)\Steam\steamapps\common\Left 4 Dead 2
Executable=l4d2.exe
AutoOptimize=true
; Set to true to automatically apply performance optimizations on launch

[Hotkeys]
; Hotkey settings for performance adjustments
IncreaseFPS=F1
; Press F1 to increase the frame rate limit
DecreaseFPS=F2
; Press F2 to decrease the frame rate limit
ToggleVSync=F3
; Press F3 to toggle vertical sync on and off
TogglePerformanceMode=F4
; Press F4 to switch between performance and quality modes

[Features]
; Features available in the performance patch
EnableLowResTextures=true
; Set to true to use lower resolution textures for better performance
DisableUnnecessaryParticles=true
; Set to true to disable extra particle effects for improved FPS
OptimizeNetworkTraffic=true
; Set to true to enhance network performance for smoother gameplay
ImproveAIResponse=true
; Set to true to optimize zombie AI for better performance in large hordes

[Display]
; Display settings for optimization
Resolution=1920x1080
; Desired resolution for gameplay
Fullscreen=true
; Set to true to run the game in fullscreen mode; false for windowed
MaxFPS=144
; Set the maximum frame rate (can be adjusted using hotkeys)
TextureQuality=Low
; Texture quality (Low, Medium, High); recommended to set to Low for performance
ShadowQuality=Low
; Shadow quality settings; low to gain FPS
```