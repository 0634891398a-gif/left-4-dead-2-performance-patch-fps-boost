```ini
[General]
# Path to Left 4 Dead 2 installation directory
InstallDir=C:\Program Files (x86)\Steam\steamapps\common\Left 4 Dead 2

# Enable or disable the performance patch
PerformancePatch=enabled

# Log file path for debugging purposes
LogFile=C:\L4D2_Performance_Patch\log.txt

[Hotkeys]
# Set hotkey to toggle the performance patch
TogglePatchKey=F12

# Set hotkey for displaying performance metrics
ShowMetricsKey=F10

# Set hotkey to reset settings to default
ResetSettingsKey=F11

[Features]
# Enable or disable FPS cap (frames per second)
EnableFPSCap=true
MaxFPS=144

# Enable or disable the texture optimization feature
OptimizeTextures=true

# Enable or disable shadows
EnableShadows=false

# Enable or disable the gore effect
EnableGore=true

# Enable V-Sync to prevent screen tearing
EnableVSync=false

[Display]
# Set the resolution for Left 4 Dead 2
ResolutionWidth=1920
ResolutionHeight=1080

# Set the fullscreen mode (true or false)
Fullscreen=true

# Set the field of view (FOV) for a wider perspective
FieldOfView=90

# Enable or disable anti-aliasing (can impact performance)
EnableAntiAliasing=false

# Set brightness level (0-1)
Brightness=0.8
```